}

function fin(k){const c=S.c[k],r=c.gdp*c.tax/400*(th(c,'t1')?1.1:1)*(capHeld(k)&&capHeld(k)!=k?.85:1),fee=S.orgs.filter(o=>o.m.includes(k)).length*2;return r-(r*(c.def+c.soc+35)/100+(c.mil*.2+c.arm*.3+c.air*.6+(c.nav||0)*.5)*(th(c,'m2')?.8:1)+c.debt*ir(c)+fee)}
const th=(c,id)=>c.k==S.me?S.tech[id]:(c.at||{})[id],mu=(k,i)=>Math.max(.5,Math.min(2.5,PW[k][i]*PW[k].length)),ir=c=>th(c,'t2')?.01:.015;
function bt(o,t){let s=0;for(const k in S.c)if(S.c[k].own==o)s+=S.pv[k].reduce((a,p,i)=>a+(p.b[t]||0)*mu(k,i)*(p.sab&&p.sab.t>0?.4:1),0);return s}

function loss(c,r){const o=c.mil;c.mil=Math.max(0,o-Math.round(o*r));const q=o?c.mil/o:0;c.arm=Math.round(c.arm*q);c.air=Math.round(c.air*q);c.nav=Math.round((c.nav||0)*q);c.mor=Math.max(5,c.mor-r*20)}
function absorb(a,b,fx){const A=S.c[a],B=S.c[b];A.pop+=B.pop;A.gdp+=B.gdp*fx;A.mil+=Math.round(B.mil*fx);A.arm+=Math.round(B.arm*fx);A.air+=Math.round(B.air*fx);A.debt+=B.debt;A.tre+=Math.max(0,B.tre)*fx;
  for(const k in S.c)if(S.c[k].own===b)S.c[k].own=a;
  S.orgs.forEach(o=>{o.m=o.m.filter(x=>x!=b)});S.pacts=S.pacts.filter(p=>!p.includes(b));S.guar=S.guar.filter(g=>!g.includes(b));S.units.forEach(u=>{if(u.o==b)u.o=a});Object.keys(S.c).forEach(k=>S.pv[k].forEach(p=>{if(S.c[k].own==a)p.occ=null}));recount(a);recount(b);showBan(a,b)}

function msg(x){S.msg=x;render()}

function improve(k){const m=S.c[S.me];if(m.tre<3)return msg('Necesitas $3B en el tesoro.');m.tre-=3;m.rel[k]=Math.min(100,m.rel[k]+12);S.c[k].rel[S.me]=Math.min(100,S.c[k].rel[S.me]+12);add(`${m.n} envió una misión diplomática a ${S.c[k].n}.`);render()}
function annex(k){const m=S.c[S.me],c=S.c[k],cost=Math.max(1,c.gdp*.02);
  if(m.rel[k]<85)return msg('Requiere relación de 85 o más.');if(m.tre<cost)return msg(`Necesitas ${f(cost)} en el tesoro.`);
  if(atWar(S.me,k))return msg('No puedes negociar en plena guerra.');
  m.tre-=cost;absorb(S.me,k,1);add(`${c.n} se integró pacíficamente a ${m.n}.`);render()}
function startWar(a,d){const A=S.c[a],B=S.c[d];if(atWar(a,d))return;A.infamy+=15;A.rel[d]=Math.max(0,A.rel[d]-30);B.rel[a]=Math.max(0,B.rel[a]-30);
  const pi=S.pacts.findIndex(p=>p.includes(a)&&p.includes(d));if(pi>=0){S.pacts.splice(pi,1);A.infamy+=25;add(`${A.n} rompió su pacto de no agresión con ${B.n}.`)}
  S.wars.push({a,d,p:0});add(`¡${A.n} invade ${B.n}!`);
  S.guar.filter(g=>g[1]==d&&g[0]!=a&&alive(g[0])&&!atWar(g[0],a)).forEach(g=>{S.wars.push({a:g[0],d:a,p:0});add(`${S.c[g[0]].n} defiende a ${B.n} y declara la guerra a ${A.n}.`)})}
function war(k){startWar(S.me,k);S.tab='war';render()}
function peace(i){const w=S.wars[i];S.wars.splice(i,1);occClear(w.a,w.d);S.c[S.me].stab=Math.max(0,S.c[S.me].stab-2);add(`Se firmó la paz entre ${S.c[w.a].n} y ${S.c[w.d].n}.`);render()}
function recruitOld(t,n){const m=S.c[S.me],cost={inf:8,arm:18,air:25}[t]*n;

function joinOrg(id){const o=S.orgs.find(x=>x.id==id);if(o.m.includes(S.me))o.m=o.m.filter(x=>x!=S.me);else o.m.push(S.me);render()}
function eco(a){const m=S.c[S.me],g=m.gdp;
  if(a=='bonds'){m.tre+=g*.05;m.debt+=g*.05;m.inf+=1.5;add(`${m.n} emitió bonos por ${f(g*.05)}.`);return render()}
  const cost={subs:.04,infra:.06,anti:.03}[a]*g;if(m.tre<cost)return msg(`Necesitas ${f(cost)} en el tesoro.`);m.tre-=cost;
  if(a=='subs')m.stab=Math.min(100,m.stab+5);if(a=='infra')m.gdp*=1.03;if(a=='anti')m.inf=Math.max(0,m.inf-2);
  add(`${m.n} aplicó ${{subs:'subsidios',infra:'inversión en infraestructura',anti:'una política anti-inflación'}[a]}.`);render()}

function dipList(){const m=S.c[S.me],q=DQ.trim().toLowerCase();return Object.keys(S.c).filter(k=>k!=S.me&&alive(k)&&(!q||S.c[k].n.toLowerCase().includes(q)||capHtml(k).toLowerCase().includes(q))).sort((a,b)=>S.c[a].n.localeCompare(S.c[b].n,'es')).map(k=>{const c=S.c[k],r=m.rel[k];return `<div class="card" onclick="pick('${k}')"><div class="row" style="border:0;padding:0"><b>${c.n}</b><b style="color:${r>65?'var(--ok)':r<35?'var(--bad)':'var(--tx)'}">${r}/100</b></div><div class="mu">🏛 ${capHtml(k)}</div><div class="bar"><i style="width:${r}%"></i></div>${atWar(S.me,k)?'<div class="mu">En guerra</div>':''}</div>`}).join('')||'<p class="mu">Sin resultados.</p>'}
function dipl(a,k){const m=S.c[S.me],c=S.c[k],r=m.rel[k];
  if(a=='pact'){if(r<=30)return msg('Requiere relación mayor a 30.');if(hasPact(S.me,k))return msg('Ya existe un pacto.');S.pacts.push([S.me,k]);m.rel[k]=Math.min(100,r+5);c.rel[S.me]=Math.min(100,c.rel[S.me]+5);add(`${m.n} y ${c.n} firmaron un pacto de no agresión.`)}
  if(a=='san'){if(m.tre<3)return msg('Necesitas $3B.');m.tre-=3;c.gdp*=.97;c.stab=Math.max(0,c.stab-2);m.rel[k]=Math.max(0,r-15);c.rel[S.me]=Math.max(0,c.rel[S.me]-15);m.infamy+=3;add(`${m.n} impuso sanciones a ${c.n}.`)}
  if(a=='gua'){if(m.tre<5)return msg('Necesitas $5B.');if(S.guar.some(g=>g[0]==S.me&&g[1]==k))return msg('Ya garantizas su independencia.');m.tre-=5;S.guar.push([S.me,k]);c.rel[S.me]=Math.min(100,c.rel[S.me]+10);add(`${m.n} garantiza la independencia de ${c.n}.`)}
  if(a=='pup'){if(r<60||pw(m)<pw(c)*1.2||m.tre<10)return msg('Requiere relación 60+, ejército 20% mayor y $10B.');m.tre-=10;c.vas=S.me;add(`${c.n} aceptó ser estado títere de ${m.n}.`)}

function createOrg(){const m=S.c[S.me],n=$('on').value.trim();if(!n)return msg('Escribe un nombre.');if(m.tre<10)return msg('Necesitas $10B.');

function resProd(o){const r=[0,0,0,0,0,0];for(const k in S.c)S.pv[k].forEach((p,i)=>{if(ctrl(k,i)!=o)return;const f=(p.sab&&p.sab.t>0?.4:1)*(p.occ?.25:(k==o?1:.6));PR[k][i].forEach((v,j)=>{r[j]+=v*f})});return r}

const cellAt=(x,y)=>x<0||y<0||x>=GW*GS||y>=GH*GS?-1:Math.floor(y/GS)*GW+Math.floor(x/GS);
function seaPath(src,to){const prev=new Map(),q=[];src.forEach(s=>{prev.set(s,-1);q.push(s)});for(let h=0;h<q.length;h++){const c=q[h];if(c==to)break;(SADJ[c]||[]).forEach(n=>{if(!prev.has(n)){prev.set(n,c);q.push(n)}})}
  if(!prev.has(to))return null;const p=[];for(let c=to;c!=-1;c=prev.get(c))p.push(c);return p.reverse()}
function navStep(u,to){const en=S.units.filter(x=>x.k=='~'&&x.i==to&&atWar(u.o,x.o));
  if(en.length){const pa=uP(u)*(.8+Math.random()*.4),pd=en.reduce((s,x)=>s+uP(x),0)*(.8+Math.random()*.4),tot=en.reduce((s,x)=>s+x.n,0),w=pa>pd;
    if(w){S.units=S.units.filter(x=>!en.includes(x));u.n-=Math.ceil(u.n*(pd/pa)*.5);add(`Victoria naval de ${S.c[u.o].n}.`)}else{u.n-=Math.ceil(u.n*.6);hit(en,Math.max(1,Math.round(tot*pa/pd*.5)));add(`${S.c[u.o].n} pierde un combate naval.`)}
    S.units=S.units.filter(x=>x.n>0);en.forEach(x=>recount(x.o));recount(u.o);if(!w||u.n<=0)return false}
  u.k='~';u.i=to;const sm=S.units.find(x=>x!==u&&x.o==u.o&&x.t=='nav'&&x.k=='~'&&x.i==to);if(sm){sm.n+=u.n;S.units.splice(S.units.indexOf(u),1);return false}return true}
function navAdvance(u,steps){steps=steps||3;if(u.dest==null)return;const dock=u.k!='~',src=dock?[...(PS[u.k+':'+u.i]||[])]:[u.i],p=seaPath(src,u.dest);if(!p){u.dest=null;return}
  const st=dock?p:p.slice(1);for(let j=0;j<Math.min(steps,st.length);j++){if(!navStep(u,st[j])){u.dest=null;return}}if(u.k=='~'&&u.i==u.dest)u.dest=null}
function seaOrder(u,n){if(n<0)return;if(!SEA.has(n)){const nb=[-1,1,-GW,GW,-GW-1,-GW+1,GW-1,GW+1].map(d=>n+d).filter(c=>SEA.has(c));if(!nb.length)return msg('Eso es tierra. Toca una zona de mar.');n=nb[0]}
  if(u.k=='~'&&u.i==n)return;const src=u.k=='~'?[u.i]:[...(PS[u.k+':'+u.i]||[])];if(!src.length||!seaPath(src,n))return msg('No hay ruta marítima hasta ese punto.');

function tryOrder(u,k,i){const id=k+':'+i;if(u.k==k&&u.i==i)return false;

const bic=t=>IMG[t]?'<img class="bi" alt="" src="'+IMG[t]+'">':'',uic=t=>IMG[t]?'<img class="bi" alt="" src="'+IMG[t]+'">':'';
let CQ='';
function cpList(){const q=CQ.trim().toLowerCase();return Object.keys(S.c).filter(k=>alive(k)&&(!q||S.c[k].n.toLowerCase().includes(q)||capHtml(k).toLowerCase().includes(q))).sort((a,b)=>S.c[a].n.localeCompare(S.c[b].n,'es')).map(k=>{const c=S.c[k];return `<button class="card" style="display:block;width:100%;text-align:left" onclick="chooseCountry('${k}')"><div class="row" style="border:0;padding:0"><b><i class="dot" style="background:${PAL(k)};display:inline-block;margin-right:6px"></i>${c.n}${k==S.me?' ✓':''}</b><span class="mu">👥 ${pf(c.pop)} · 💰 ${f(c.gdp)}</span></div><div class="mu">🏛 ${capHtml(k)}</div></button>`}).join('')||'<p class="mu">Sin resultados.</p>'}
function chooseCountry(k){S.me=k;S.sel=null;S.pi=null;S.us=null;S.modal=false;save();playGame()}
function cadj(){if(cadj.c)return cadj.c;const r={};for(const a in ADJ)ADJ[a].forEach(b=>{const x=a.split(':')[0],y=b.split(':')[0];if(x!=y)(r[x]||(r[x]=new Set())).add(y)});return cadj.c=r}
const capI=k=>CAP[k]?PN[k].indexOf(CAP[k][1]):-1;
const capHeld=k=>{const i=capI(k);return i<0?null:ctrl(k,i)};
function audit(){const e=[];for(const k in S.c){const c=S.c[k];if(!S.c[c.own])e.push('propietario inexistente: '+k);for(const x of ['pop','gdp','tre','stab','mil'])if(!isFinite(c[x]))e.push('valor no numérico '+x+' en '+k);if(k!='CAM'&&!CAP[k])e.push('sin capital: '+k);if(CAP[k]&&capI(k)<0)e.push('capital sin provincia: '+k);if(S.pv[k].length!=PV[k].length)e.push('provincias desalineadas: '+k);S.pv[k].forEach((p,i)=>{if(p.occ&&!alive(p.occ))e.push('ocupación de país inactivo: '+k+':'+i)})}
S.wars.forEach(w=>{if(!S.c[w.a]||!S.c[w.d]||!alive(w.a)||!alive(w.d))e.push('guerra con país inactivo: '+w.a+'-'+w.d)});
S.units.forEach(u=>{if(!S.c[u.o]||!alive(u.o))e.push('unidad de país inactivo #'+u.id);if(u.k!='~'&&!(S.pv[u.k]&&S.pv[u.k][u.i]))e.push('unidad en provincia inexistente #'+u.id);if(!(u.n>0))e.push('unidad vacía #'+u.id)});return e}
function migrate(t){t.from=t.v||'1.0.0';t.v=VER;return t}
const VER='1.2.0';let CFG={th:'auto',fs:'m',lb:1};

function resolveVote(){
  const v=S.vote;if(!v)return;S.vote=null;const o=S.orgs.find(x=>x.id==v.org);if(!o||!o.m.includes(S.me))return;
  const mem=o.m.filter(k=>k!=S.me&&alive(k));let yes=1;
  mem.forEach(k=>{const c=S.c[k];let s=(c.rel[S.me]-50)/50+(Math.random()-.5)*.8;
    if(v.type=='DEF')s+=.3;if(v.type=='SAN')s+=c.rel[v.tgt]<45?.5:-.4;if(v.type=='RES')s-=.2;if(s>0)yes++});
  const tot=mem.length+1,ok=yes>tot/2,m=S.c[S.me],nm={DEF:'pacto de defensa',SAN:'embargo a '+(S.c[v.tgt]||{}).n,RES:'fondo de rescate'}[v.type];
  add(`${o.n}: la moción de ${nm} ${ok?'fue aprobada':'fue rechazada'} (${yes} de ${tot} a favor).`);
  if(!ok)return;
  if(v.type=='DEF')mem.concat(S.me).forEach(a=>mem.concat(S.me).forEach(b=>{if(a!=b)S.c[a].rel[b]=Math.min(100,S.c[a].rel[b]+8)}));
  if(v.type=='SAN'&&S.c[v.tgt]){const t=S.c[v.tgt];t.gdp*=.97;t.stab=Math.max(0,t.stab-3);mem.forEach(k=>S.c[k].rel[v.tgt]=Math.max(0,S.c[k].rel[v.tgt]-10))}
  if(v.type=='RES'){mem.forEach(k=>S.c[k].tre-=.5);m.tre+=m.gdp*.01;m.inf+=.5}
}
function nextTurn(){
  S.turn++;S.units.forEach(u=>{u.m=false});S.fx=[];S.units.filter(u=>u.t=='nav'&&u.dest!=null).forEach(u=>navAdvance(u));resolveVote();resolveAI();
  for(const k in S.c){const c=S.c[k];if(c.own!==k)continue;
    const w=S.wars.filter(x=>x.a==k||x.d==k).length;
    c.tre+=fin(k);resTurn(k,c,w);
    const g=(.026+(c.stab-60)/2500-Math.max(0,c.tax-30)/1200-Math.max(0,c.inf-8)/1500-w*.004)/4+bt(k,'fab')*.0015+bt(k,'por')*.001+(th(c,'t3')?.002:0);
    c.gdp*=1+g;c.pop*=1+(c.stab>50?.0022:.0008)+bt(k,'agr')*.0003+(th(c,'c2')?.0005:0);
    c.inf=Math.max(0,c.inf+(c.tre<0?.8:-(c.inf-3)*.08)+(c.soc>35?.1:0)-bt(k,'agr')*.05);
    c.stab=Math.max(0,Math.min(100,c.stab+(c.soc-20)*.04-(c.tax-25)*.05-(c.inf-4)*.04-w*.8-c.infamy/80+(c.tre<0?-2:.2)+(th(c,'c1')?.3:0)+bt(k,'hos')*.4+bt(k,'cap')*.3));
    c.infamy=Math.max(0,c.infamy-1);
    c.mor=Math.max(10,Math.min(100,c.mor+(w?-3:(c.stab>60?1:-.5))+(c.def-15)*.05));
    if(c.vas&&alive(c.vas)){const tb=c.gdp*c.tax/400*.15;c.tre-=tb;S.c[c.vas].tre+=tb}
    if(k!=S.me){
      const ks=Object.keys(S.c).filter(x=>x!=k&&alive(x));
      if(Math.random()<.3){const o=ks[Math.floor(Math.random()*ks.length)];c.rel[o]=Math.min(100,c.rel[o]+4);S.c[o].rel[k]=Math.min(100,S.c[o].rel[k]+4)}
      if(c.tre>c.gdp*.1&&c.mil<cap(c)&&Math.random()<.2){addUnit(k,'inf',1,home(k));c.tre-=8}
      if(c.tre<0)c.tax=Math.min(35,c.tax+1);aiBuild(k);aiTech(c);aiMove(k);
      if(c.stab<25&&Math.random()<.15)add(`Crisis política en ${c.n}: protestas masivas.`);
      const me=S.c[S.me];
      if(Math.random()<.02&&c.rel[S.me]<30&&pw(c)>pw(me)*1.3&&!atWar(k,S.me)&&!hasPact(k,S.me))startWar(k,S.me);
      if(Math.random()<.012&&c.sup>5&&c.oil>5&&c.tre>0&&c.infamy<60&&!S.wars.some(x=>x.a==k||x.d==k)){const nb=[...(cadj()[k]||[])].filter(x=>x!=S.me&&alive(x)&&c.rel[x]<25&&!atWar(k,x)&&!hasPact(k,x)&&pw(c)>pw(S.c[x])*1.5).sort((a,b)=>c.rel[a]-c.rel[b])[0];if(nb)startWar(k,nb)}
    }
  }
  for(const k in S.c)S.pv[k].forEach(p=>{if(p.sab&&p.sab.t>0)p.sab.t--});
  {const m0=S.c[S.me];S.rp+=(2+bt(S.me,'edu')*3+m0.gdp/500)*(th(m0,'c3')?1.3:1)}
  S.wars=S.wars.filter(w=>{const a=S.c[w.a],d=S.c[w.d];if(a.own!==w.a||d.own!==w.d)return false;
    const pa=pw(a)*(a.stab/200+.5)*(.5+a.mor/200)*(1+a.def/100)*(.8+Math.random()*.4),pd=pw(d)*(d.stab/200+.5)*(.5+d.mor/200)*(1+d.def/100)*(1.05+Math.min(.6,.08*bt(d.k,'for')))*(.8+Math.random()*.4),tt=pa+pd+.01;
    w.p+=(pa-pd)/tt*30+occ(w);{const cd=capHeld(w.d),ca=capHeld(w.a);if(cd==w.a){w.p+=12;d.stab=Math.max(0,d.stab-1.5)}if(ca==w.d){w.p-=12;a.stab=Math.max(0,a.stab-1.5)}}loss(a,.14*pd/tt);loss(d,.14*pa/tt);syncUnits(w.a);syncUnits(w.d);
    a.stab=Math.max(0,a.stab-1);d.stab=Math.max(0,d.stab-1.5);
    if(w.p>=100){absorb(w.a,w.d,.7);add(`${a.n} conquistó ${d.n}.`);return false}
    if(w.p<=-100){a.infamy+=5;a.stab=Math.max(0,a.stab-8);add(`La ofensiva de ${a.n} contra ${d.n} fracasó.`);return false}
    return true});
  S.wars=S.wars.filter(w=>alive(w.a)&&alive(w.d));
  if(!S.ai&&Math.random()<.2){const mo=S.orgs.filter(o=>o.m.includes(S.me));if(mo.length){const o=mo[Math.floor(Math.random()*mo.length)],ms=o.m.filter(k=>k!=S.me&&alive(k));if(ms.length){const by=ms[Math.floor(Math.random()*ms.length)],tgt=Object.keys(S.c).filter(k=>k!=by&&alive(k)).sort((a,b)=>S.c[by].rel[a]-S.c[by].rel[b])[0];S.ai={org:o.id,by,tgt,type:Math.random()<.6?'SAN':'DEF',vote:null};add(`${S.c[by].n} presentó una moción en ${o.n}. Revísala en la pestaña Orgs.`)}}}
  add(`Comienza el turno ${S.turn}: ${dt()}.`);render()
}

let V={x:0,y:0,w:800,h:660},dragged=false;const svg=$('svg'),ptr=new Map();
function setV(){V.w=Math.max(60,Math.min(800,V.w));V.h=V.w*660/800;V.x=Math.max(-20,Math.min(820-V.w,V.x));V.y=Math.max(-20,Math.min(680-V.h,V.y));svg.setAttribute('viewBox',`${V.x} ${V.y} ${V.w} ${V.h}`);labels()}
function zoomAt(fc,cx,cy){const p=svg.createSVGPoint();p.x=cx;p.y=cy;const q=p.matrixTransform(svg.getScreenCTM().inverse()),nw=Math.max(60,Math.min(800,V.w*fc)),r=nw/V.w;V.x=q.x-(q.x-V.x)*r;V.y=q.y-(q.y-V.y)*r;V.w=nw;setV()}
function zoomBy(fc){const r=svg.getBoundingClientRect();zoomAt(fc,r.left+r.width/2,r.top+r.height/2)}
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?.8:1.25,e.clientX,e.clientY)},{passive:false});
svg.addEventListener('pointerdown',e=>{ptr.set(e.pointerId,[e.clientX,e.clientY]);dragged=false});
svg.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;const o=ptr.get(e.pointerId);
  if(ptr.size==2){const [a,b]=[...ptr.values()],d0=Math.hypot(a[0]-b[0],a[1]-b[1]);ptr.set(e.pointerId,[e.clientX,e.clientY]);const [c,d]=[...ptr.values()],d1=Math.hypot(c[0]-d[0],c[1]-d[1]);if(d0>0&&d1>0){zoomAt(d0/d1,(c[0]+d[0])/2,(c[1]+d[1])/2);dragged=true}}
  else{const dx=e.clientX-o[0],dy=e.clientY-o[1];if(dragged||Math.hypot(dx,dy)>5){dragged=true;const sc=Math.min(svg.clientWidth/V.w,svg.clientHeight/V.h);V.x-=dx/sc;V.y-=dy/sc;ptr.set(e.pointerId,[e.clientX,e.clientY]);setV()}}});
['pointerup','pointercancel','pointerleave'].forEach(t=>svg.addEventListener(t,e=>{ptr.delete(e.pointerId);if(!ptr.size)setTimeout(()=>{dragged=false},60)}));
function labels(){if(labels.w===V.w)return;labels.w=V.w;const px=Math.min(svg.clientWidth/V.w,svg.clientHeight/V.h)||1;
